<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astro Jamstack Starter • TermuxPanel</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #030712; color: #f9fafb; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
    .hero { text-align: center; max-width: 680px; width: 100%; padding: 40px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; backdrop-filter: blur(10px); }
    h1 { font-size: 32px; background: linear-gradient(135deg, #ff5e00, #ff0077, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; }
    p { color: #9ca3af; line-height: 1.6; font-size: 16px; }
    .features { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 30px; text-align: left; }
    .feat-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); padding: 16px; border-radius: 8px; }
    .feat-card h4 { margin: 0 0 6px 0; color: #f3f4f6; }
    .feat-card p { margin: 0; font-size: 13px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>🚀 Astro Jamstack Starter</h1>
    <p>Ultra-fast static web architecture with near-zero JavaScript payload, ready for production SEO and edge CDN delivery.</p>
    <div class="features">
      <div class="feat-card">
        <h4>⚡ 100% Mobile Ready</h4>
        <p>Optimized for lightweight hosting with instant cold starts.</p>
      </div>
      <div class="feat-card">
        <h4>🛡️ Zero Trust SSL</h4>
        <p>Protected by Cloudflare Edge & Anycast CDN.</p>
      </div>
    </div>
  </div>
</body>
</html>
